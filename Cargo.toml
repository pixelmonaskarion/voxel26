[package]
name = "voxel26"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features=["derive"] }
env_logger = "0.11.11"
image = "0.25.10"
tokio = { version = "1.53.1", features = ["full"] }
wgpu = "30.0.0"
wgpu_text = "30.0.0"
bespoke-engine = { path = "../bespoke-engine" }
log = "0.4.33"
load_file = "1.0.1"
phf = { version = "0.14.0", features = ["macros"]}
winit = "0.30.13"
futures = "0.3.33"
noise = "0.9.0"
itertools = "0.15.0"
rand = "0.10.2"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
rustc-hash = "2.1.3"
directories = "6.0.0"
ordered-float = { version = "5.5.0", features = ["serde"] }
thiserror = "2.0.20"
serde-inline-default = "1.0.2"
flate2 = "1.1.10"
rkyv = "0.8.18"
glam = { version = "0.33.7", features = ["serde", "rkyv", "bytecheck"] }

[build-dependencies]
bespoke-engine = { path = "../bespoke-engine" }
image = "0.25.10"
glam = { version = "0.33.7", features = ["serde", "rkyv"] }
wgpu = "30.0.0"
bytemuck = { version = "1.25.2", features=["derive"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }

[[bin]]
name = "voxel26"
path = "src/desktop.rs"

