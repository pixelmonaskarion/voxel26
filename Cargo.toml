[package]
name = "voxel26"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.25.0", features=["derive"] }
cgmath = "0.18.0"
env_logger = "0.11.10"
image = "0.25.10"
tokio = { version = "1.51.0", features = ["full"] }
wgpu = "29.0.1"
wgpu_text = "29.0.0"
bespoke-engine = { path = "../bespoke-engine" }
log = "0.4.29"
load_file = "1.0.1"
phf = { version = "0.14.0", features = ["macros"]}
winit = "0.30.13"
futures = "0.3.32"
noise = "0.9.0"
itertools = "0.15.0"
rand = "0.10.1"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
bespoke-engine = { path = "../bespoke-engine" }

[[bin]]
name = "voxel26"
path = "src/desktop.rs"

